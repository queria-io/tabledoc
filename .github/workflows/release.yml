name: Release

on:
  workflow_dispatch:
    inputs:
      force:
        description: Bump this part regardless of the commits (patch, minor, major); empty to follow the commits
        required: false
        default: ""

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: python-semantic-release/python-semantic-release@v9
        id: release
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          force: ${{ inputs.force }}

      # Publishing runs in a separate workflow so a failed upload can be
      # retried against the tag without re-running semantic-release.
      - if: steps.release.outputs.released == 'true'
        run: gh workflow run publish.yml --ref main -f ref=${{ steps.release.outputs.tag }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
