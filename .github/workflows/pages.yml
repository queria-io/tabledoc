name: Pages

# Builds the documentation site (Blume) and serves it with the JSON Schemas under schemas/.
# A schema keeps its URL for good: change one by adding v2, never by editing v1's meaning.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "public/**"
      - "src/tabledoc/schemas/**"
      - "blume.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: |
          cp -r src/tabledoc/schemas dist/schemas
          rm -rf dist/schemas/legacy
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
