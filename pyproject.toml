[project]
name = "tabledoc"
version = "0.3.0"
description = "Describe the tables of a dataset in YAML and Markdown (or dbt), check it, and read it from Python"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "flo8s" }]
dependencies = [
    "duckdb>=1.1",
    "fdl-cli>=0.34",
    "jsonschema>=4.18",
    "pyyaml>=6.0",
    "referencing>=0.30",
]

[project.urls]
Homepage = "https://github.com/queria-io/tabledoc"
Repository = "https://github.com/queria-io/tabledoc"
Changelog = "https://github.com/queria-io/tabledoc/blob/main/CHANGELOG.md"

[project.scripts]
tabledoc = "tabledoc.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tabledoc"]

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
allow_zero_version = true
major_on_zero = false

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv.sources]
# fdl meta load, dump and objects arrive in fdl-cli 0.34; until it is released.
fdl-cli = { git = "https://github.com/queria-io/fdl", rev = "a39abe8020b2f4eaf1379c44a57b940cfd4a3e39" }
